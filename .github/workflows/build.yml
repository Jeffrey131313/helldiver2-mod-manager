name: Build mod_manager

permissions:
  contents: write

on:
  push:
    branches:
      - latest

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build executable with PyInstaller
      run: |
        pyinstaller --onefile --icon=app_icon.ico --noconsole --additional-hooks-dir=. --add-data "app_icon.ico;." --add-data "default.png;." mod_manager.py

    - id: get_version
      run: |
        import os, yaml
        
        with open('info.yml', 'r', encoding='utf-8') as f:
            data = yaml.safe_load(f)
        
        version = data['version']
        log = data.get('log', '')
        
        log_lines = log.splitlines()
        formatted_log = '\n'.join(f"- {line}" for line in log_lines)
        
        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
            print(f"version={version}", file=fh)
            print(f"log={formatted_log}", file=fh)
      shell: python

    - name: Create Release and upload assets
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: Release ${{ steps.get_version.outputs.version }}
        body: |
          ${{ steps.get_version.outputs.version }}
          更新内容:
          ${{ steps.get_version.outputs.log }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
